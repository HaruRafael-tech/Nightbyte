<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Nightbyte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <nav>
        <div class="nav-conteudo">
            <a href="index.html" class="logo-link">
                <img src="./src/img/nightbyte-logo.png" alt="Nightbyte" class="logo-img">
            </a>
            <ul class="menu">
                <li><a href="index.html" class="active">HOME</a></li>
                <li><a href="sobre.html">SOBRE</a></li>
                <li><a href="contato.html">CONTATO</a></li>
            </ul>
        </div>

    <div class="container">
        <h1>Contato</h1>
        <p>Quer publicar seu jogo aqui ou falar com a gente? Preencha o formulário ou manda um e-mail pra
            contatoNightbyte@gmail.com.br</p>
                <p>Quer publicar algum mod ? Preencha o formulário ou manda um e-mail pra
            modsNightbyte@gmail.com.br</p>
        <form>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" required></textarea>
            <button type="submit">Enviar</button>
        </form>
    </div>
</body>
